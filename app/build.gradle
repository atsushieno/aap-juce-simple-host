plugins {
    id 'com.android.application'
}

kotlin {
    jvmToolchain(17)
}

android {
    ndkVersion libs.versions.ndk.get()
    namespace 'org.androidaudioplugin.samples.juce.simple_plugin_host'

    compileSdk = libs.versions.android.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "org.androidaudioplugin.samples.juce.simple_plugin_host"
        minSdk = libs.versions.android.minSdk.get().toInteger()
        ndk {
            // should we make it customizable? We skip others just to reduce build time.
            abiFilters "x86_64", "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release", "-DJUCEAAP_ENABLED=1",
                        "-DANDROID_STL=c++_shared",
                        "-DANDROID_CPP_FEATURES=exceptions rtti"
            }
        }
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }

    sourceSets {
        main.java.srcDirs +=
            ["../external/AndroidPluginHost/external/JUCE/modules/juce_gui_basics/native/javaopt/app",
             "../external/AndroidPluginHost/external/JUCE/modules/juce_audio_devices/native/java/app"]
        main.res.srcDirs +=
            []
    }

    dependencies {
        implementation libs.androidx.core.ktx
        implementation libs.kotlin.stdlib.jdk8
        implementation libs.startup.runtime

        // Dogfooding the buses work (see settings.gradle).
        implementation project(":androidaudioplugin")
        implementation project(":androidaudioplugin-ui-compose")
        implementation project(":androidaudioplugin-ui-web")
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version libs.versions.cmake.get()
        }
    }

    buildFeatures {
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // LAMESPEC: JuceMidiSupports.java is too error prone so that it always fails to build.
        // We cannot enable modern strict lint checks.
        abortOnError = false
    }
}

apply from: '../external/aap-juce/gradle/aap-juce.gradle'
